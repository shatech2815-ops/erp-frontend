<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3448"/>
      <stop offset="100%" style="stop-color:#4C708E"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#bg)"/>
  <!-- Top spire / temple peak -->
  <polygon points="50,10 57,22 63,17 58,28 50,23 42,28 37,17 43,22" fill="rgba(255,255,255,0.88)"/>
  <circle cx="50" cy="8" r="3.5" fill="rgba(255,255,255,0.7)"/>
  <!-- Clean letter V (for Vaari) as central mark - bold, clear -->
  <polyline points="32,36 50,68 68,36" fill="none" stroke="white" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Small horizontal accent lines inside V for style -->
  <line x1="38" y1="48" x2="45" y2="48" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round"/>
  <line x1="55" y1="48" x2="62" y2="48" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round"/>
  <!-- Bottom decorative line -->
  <rect x="24" y="76" width="52" height="3" rx="1.5" fill="rgba(255,255,255,0.3)"/>
  <rect x="32" y="81" width="36" height="2" rx="1" fill="rgba(255,255,255,0.18)"/>
</svg>
